# Sutoor | Build Android test APK, Android release bundle, and unsigned iOS check.
# All workflows use Mac mini M2 instead of Linux x2 (not available on this account).
workflows:
  android-test:
    name: "Sutoor Android - Test APK"
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        API_URL: "https://sutoor.it.com/api/v1"
    scripts:
      - name: "Create Android host project"
        script: |
          flutter --version
          flutter create --platforms=android --org com.sutoor --project-name sutoor .
          python3 scripts/ensure_android_internet.py
      - name: "Install packages"
        script: flutter pub get
      - name: "Brand native icons and splash"
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: "Analyze source"
        script: flutter analyze --no-fatal-infos
      - name: "Run unit tests"
        script: flutter test
      - name: "Build debug APK"
        script: |
          flutter build apk --debug --dart-define=SUTOOR_API_URL="$API_URL"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  android-release:
    name: "Sutoor Android - Release AAB (signing required)"
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        API_URL: "https://sutoor.it.com/api/v1"
    scripts:
      - name: "Create Android host project"
        script: |
          flutter create --platforms=android --org com.sutoor --project-name sutoor .
          python3 scripts/ensure_android_internet.py
      - name: "Install, analyze, test"
        script: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter analyze --no-fatal-infos
          flutter test
      - name: "Build AAB (not Play Store signed)"
        script: |
          flutter build appbundle --release --dart-define=SUTOOR_API_URL="$API_URL"
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-unsigned-check:
    name: "Sutoor iOS - Unsigned compilation"
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_URL: "https://sutoor.it.com/api/v1"
    scripts:
      - name: "Create iOS host project"
        script: flutter create --platforms=ios --org com.sutoor --project-name sutoor .
      - name: "Install, analyze, test"
        script: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter analyze --no-fatal-infos
          flutter test
      - name: "Install CocoaPods"
        script: |
          cd ios
          pod install
      - name: "Build unsigned iOS app"
        script: |
          flutter build ios --release --no-codesign --dart-define=SUTOOR_API_URL="$API_URL"
    artifacts:
      - build/ios/iphoneos/Runner.app
