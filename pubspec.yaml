
workflows:
  android-test:
    name: "Sutoor Android - Test APK"
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        PACKAGE_ID: "com.sutoor.library"
        API_URL: "https://sutoor.it.com/api/v1"

    scripts:
      - name: "Generate Android project"
        script: |
          flutter create --platforms=android --org com.sutoor --project-name sutoor .

      - name: "Install dependencies"
        script: |
          flutter pub get

      - name: "Analyze Flutter project"
        script: |
          flutter analyze

      - name: "Run tests"
        script: |
          flutter test

      - name: "Build Android APK"
        script: |
          flutter build apk --debug --dart-define=SUTOOR_API_URL="$API_URL"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  android-release:
    name: "Sutoor Android - Release AAB"
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        API_URL: "https://sutoor.it.com/api/v1"

    scripts:
      - name: "Generate Android project"
        script: |
          flutter create --platforms=android --org com.sutoor --project-name sutoor .

      - name: "Install dependencies"
        script: |
          flutter pub get

      - name: "Analyze and test"
        script: |
          flutter analyze
          flutter test

      - name: "Build Android App Bundle"
        script: |
          flutter build appbundle --release --dart-define=SUTOOR_API_URL="$API_URL"

    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-unsigned-check:
    name: "Sutoor iOS - Unsigned Build"
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_URL: "https://sutoor.it.com/api/v1"

    scripts:
      - name: "Generate iOS project"
        script: |
          flutter create --platforms=ios --org com.sutoor --project-name sutoor .

      - name: "Install Flutter dependencies"
        script: |
          flutter pub get

      - name: "Analyze and test"
        script: |
          flutter analyze
          flutter test

      - name: "Install CocoaPods"
        script: |
          cd ios
          pod install

      - name: "Build iOS without signing"
        script: |
          flutter build ios --release --no-codesign --dart-define=SUTOOR_API_URL="$API_URL"

    artifacts:
      - build/ios/iphoneos/Runner.app
