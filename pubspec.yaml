name: sutoor
description: Sutoor premium digital library mobile application
publish_to: none
version: 1.0.0+2
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  google_fonts: ^6.3.2
  pdfx: ^2.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true
  assets:
    - assets/images/brand.jpg
    - assets/images/hero-library.jpg
    - assets/images/app-icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app-icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#064833"
  image: assets/images/app-icon.png
  android_12:
    color: "#064833"
    image: assets/images/app-icon.png
  android: true
  ios: true
